l_english:
 #Religions
 perennial: "Perennial"
  hukar_sharud: "Hukar Sharud"
   hukar_sharud_religion_desc: "The ethnic religion of the Audaladae, originally founded in Jagdas. The faith believes in the all-including divinity Aradusu Aderrid, who slumbers, and that his dream is our world. The subconscious aspects of the Aradusu Aderrid include all gods known to mankind known as the Yimmu Laharae. These aspects compete for influence in the collective consciousness. Under the guidance of the messenger aspect Hukar Sharud, followers of the faith seek to keep balance between the Yimmu Laharae, thus preventing divine conflict creating strife in the corporeal world. Certain branches hold that the Audalad Dynasty are the holy servants and scions of the Hukar itself."
  red_cult: "Red Cult"
   red_cult_religion_desc: "A violent and ancient religion which inhabited the Geshemi Lands years before the Jagdasian Audaladae migrated to Rathnir.\nIts most devout followers embrace their animalistic desires and sacrifice the weak in bloody rituals in order to satiate the §RYara-Sanguid§!, The Blood God."
  abyss_mysticism: "Abyss Mysticism"
   abyss_mysticism_religion_desc: ""I require no love nor praise from thee. Do not kneel, for thine offerings shall be of the mind, not flesh. Carve and shape the ice in the image of thy dreams and know that it pleases me. Seek the mysteries of the world, for my secrets are infinite and by those deeds thou shall strengthen my spirit. Build thine temples of wisdom far from profane eyes. Let them be hidden as I am. Gather knowledge of others, and always give them a secret in return.\n\nThus the Meaning is created."\n- §PThe Mysterium Tenebris§!, as received by Assurdirapal"
  zentivar: "Zentivar"
   zentivar_religion_desc: "Zentivar is a religion focused on pursuing the improvement of the soul over many lives, through adherence to a set of values codified by §RAthaz the Traveler§!. Zentivar lacks any element of worship or creationism, and while it recognizes the existence of many entities that are seen as gods in other faiths, it refuses to acknowledge them having complete mastery over the world or nature."
 alteniquian: "Alteniquian" 
  sakrelism: "Sakrelist"
   sakrelism_religion_desc: "Long ago, Sakrelith, the One God, the Lord of Light, made himself known to the Prophet Temion. In hopes of purging their inner darkness, Sakrelists follow the example of their prophets to reject selfishness and embrace the pure light of divinity. Sakrelism was once the religion of the great Empire of Sagavir- a fact that the Prophet-Descendant in Sironia often impresses upon those around him- but the faith has since been left weak and divided."
   sakrelism_blessings: "Divine Tenets"
   pick_sakrelism_blessing: "Pick Divine Tenet"
   as_laborious_as_iniron: "As Laborious as Iniron"
   as_gentle_as_asala: "As Gentle as Asala"
   as_learned_as_ataron: "As Learned as Ataron"
   as_lawful_as_temion: "As Lawful as Temion"
   prepare_for_the_fifth_son: "Prepare for the Fifth Son"
   nurture_the_unwavering_flame: "Nurture the Unwavering Flame"
   sever_all_from_darkness_hold: "Sever all from Darkness' Hold"
   HOLY_SITE_244_DESC: "Atop the tallest of Azethvir's many hills stands the proud §YSanctum of the Judge§!, the holiest site of Sakrelith's faithful. Constructed under Temion, the legendary founder of Sironia, this temple has since bore witness to countless miracles, the last three of which elevated the great Archon, Rithaur IV, to the status of Prophet-Descendant."
   HOLY_SITE_257_DESC: "Deep within the winding tunnels and caverns of Lapidovir lays the imposing §YSanctum of the Smith§!, the hall of Iniron's followers. Inlaid into a wide light-caressed cavern deep below the earth, it is believed that this temple once served as a great fortress of the goblin Underkingdom before it was sacked and seized by the Sagaviri of Old, in a great charge led by none other than Iniron, one of Sakrelith's messengers, who laboured for years on end to cleanse the Underdark below Aldovir of the Darkness' hold."
   HOLY_SITE_215_DESC: "Gently nestled within the great old groves of Raêl sits the welcoming §YSanctum of the Mother§!, a delicate and elegant shrine erected in name of Asala. It is said that in ancient times, before even the rise of Old Sagavir, the lands of Raêl were not the rolling green hills and gentle meadows of wheat and barley one can see today; they were swamplands, marshes and thick bogs where all manner of hags, drowned and other beasts hunted the poor folk, and only through Asala's gentle fire were they purged and the land made anew."
   HOLY_SITE_285_DESC: "Prominently beyond the uneven red and black lines of Athazolant's homes rises the austere §YSanctum of the Scholar§!, a true monument to Ataron's teachings. Though lost many centuries ago to heathen invaders from Western Sparwood and Tàlor, this great temple continues, in a way, to honor the Scholar's life and legacy: scholars and scribes flood into the sanctum day by day, streaming steadily into endless halls and towers and rooms where naught but books and tomes and grimoires can be found."
   HOLY_SITE_325_DESC: "Though long departed from their native homeland and firmly disconnected from the schemes and plots of Aldovir, the Asturcians of Vastallos remain, as they forever have been, Sagaviri and Sakrelist. Unlike their kin beyond the Umbra Gulf, however, they have since come to disregard the tradition of erecting temples to singular figures or prophets, and have opted to coalesce them all into unified places of worship. And of these, none stand proudest and tallest than the §YGrand Temple of the North§!."
   HOLY_SITE_279_DESC: "Zealously inspired in Temion's image, countless priests have donned the robes of missionaries, the Asala, over the centuries and departed their homes in Aldovir to spread Sakrelith's word wide and far. Of all these missions, few found greater success than those who moored in Lumaire, the Jewel of the South. Despite similar attempts by the Soleannen of Nieden have been made, it would appear that the good folk of Lumaire find greater warmth in Sakrelith's fire than in Solaris' false flames, so much so that a temple in the image of Asturcia's has since been erected: the §YGrand Temple of the South§!"
   HOLY_SITE_673_DESC: "Zealously inspired in Temion's image, countless priests have donned the robes of missionaries, the Asala, over the centuries and departed their homes in Aldovir to spread Sakrelith's word wide and far. Of all neighbouring civilizations, few would disagree that those of Western Sparwood were they who dealt the most damage to Sagavir of Old; yet, surprisingly, even they have taken to Sakrelith's word like... moths to a flame. All over the eastern shores of the Astyllean, tabernacles and church have been erected, yet none stand tallest than the §YGrand Temple of the East§! in Serafini!"
  theiosism: "Theiosist"
   theiosism_religion_desc: "Theiosism is a monotheistic religion predominantly practiced within the Archonate of Theiónikos, which evolved from the polytheistic traditions of the Lausarii. Its sole and primary deity is Theios who is believed to be the God of the Universe and Father of Mankind. He is accompanied by a number of Angels, Servants, and Saints as well as the Four Prophets who are revered by Theiosists and Sakrelists alike for being the Incarnations of God. While originally seperate religions, the theology of Sakrelism and Theiosism are so close that Theiosism is sometimes referred to as Sakrelism's "Northern Rite"."
    hanach: "Hanach, Mother of Mankind"
    treiur: "Treiur, Angel of War"
    asria: "Asria, Angel of Nature"
    wullan: "Wullan, Angel of Light"
    garath: "Garath, Angel of Knowledge"
    turin: "Turin, Angel of Justice"
    reina: "Reina, Angel of the Wild"
    monath: "Monáth, Angel of Holy War and Penance"
  etherflame: "Etherflame"
   etherflame_religion_desc: "Born in the tempestuous continent of Sparwood, the Etherflame faith was created when new converts to the Sakrelist faith refused to abandon the myths of their old faith of Vinaestre. Disregarding settled theology, the Etherflame faith believes that by emulating Sakrelith's virtues, a person gains divine favor, and that all of the Prophets and Saints of the past were granted miracles not because it pleased Sakrelith, but because those great people had emulated Sakrelith and thus gained his power."
  aegmerism: "Aegmerist"
   aegmerism_religion_desc: "Aegmerism is the central ancient religion of the Carnian peoples, having been with them even before their migration to Aldovir. It focuses on the worship of §TAegmer§! - also known in the texts as the Man with the porcelain mask - a protector-deity of the Carnian people, and the Carnian state./nThe highest ruling power among the Carnians, whether that be a Caeron or a Shaeron, acts additionally as the head of the Aegmerist faith, being the closest person to §TAegmer§! himself. In certain interpretations of Aegmerism they're even considered fully or partially divine, taking on certain aspects of §TAegmer§! himself whenever they ascend to the throne. "
 niedene: "Niedene"
  soleannen: "Soleannen"
   soleannen_religion_desc: "Soleannen is the religion of the Niedene, and was the faith spread by the now-shattered Soleannan Empire. It reveres Solaris the Sun-God, his wife Sylene the moon-goddess, and the many other gods which the Niedene call thier own. Caligo, who trapped Solaris in the Sun and Sylene in the Moon, is reviled by all but the most wicked.\nSoleannen recognizes the Cardinal as the highest religious leader in their faith, despite the institution's many interruptions."
  soleviel: "Soleviel"
   soleviel_religion_desc: "Soleviel was a movement within Soleannen to seperate the modern church from the archaic institutions of the Soleannan and later Escharian Empire, due to percived corruption and political meddling by the Soleannen Cardinal. Soleviel Patriarchs are elected from among all the clergy in a given country, and these Patriarchs lead and guide their people. Historically, Soleviel was started in Simulami, when Felöks Zeno Hrafn declared that he would lead his faithful instead of the Cardinal, and then expelled all Soleannen clergy who did not agree to swear fealty to the country and renounce the Cardinal."
 talawan: "Talawan"
  asharu: "Asharu"
    asharu_religion_desc: "Asharu is one of the oldest religions in Rathnir, with its origin in Ummarnu and Haven before recorded history. It is largely based around the worship of powerful Spirits, with the goal of reaching enlightenment through Ashuntash- The god of light, who has one million names. The faith is very diverse, which each Asharu community having their own spirits, traditions, and theological thought."
  eastern_asharu: "Eastern Asharu"
    eastern_asharu_religion_desc: "While Western Asharu is grounded in traditions older than history, Eastern Asharu is far more recent. During a partiularly difficult period of Serafini's history, a merchant recieved, apparently by accident, a shipment of tablets describing Asharu theology. Deeply moved, the merchant proselytized across the republic, eventually settling down on the mountain of Pikcha whom he belived was a great Spirit which guarded Sparwood. While much simpler than its elder sibling, those that follow Eastern Asharu are often far more enthusiastic- and far more likely to recieve the ire of a Sakrelist or Etherflame inquisitor."
 northern: "Northern"
  noxism: "Noxist"
    noxism_religion_desc: "Noxism is a faith native to the Far North. It revolves around the 6 main "Dyvrechi" who watch and protect the people of the earth. Ruled by Afton, the dyvrechi of the sky and darkness, the Noxists communicate with the dyvrechi by sleeping in the night and respecting the will of the dyvrechi, which they believe comes to them in their dreams."
 brothian: "Brothian"
  dandelism: "Dandelist"
    dandelism_religion_desc: "Dandelism is a faith that believes that the certain people- known as Prophets- can communicate with dandelions and recieve omens from them. These omens are then interpreted to guide the community. While many omens are benign and are only concerned with community-building, warlike omens have been known to rapidly turn nations into war machines in the blink of an eye."
  tossanism: "Tossanist"
    tossanism_religion_desc: "Tossanism is the religious pantheon native to the Westreach region, which reveres five gods. Each god represents a certain people under the Ryzani umbrella. Caelus, the sky god, is the god the Ryzanis themselves. Attinstáinz, the craftsman, is the god of the Dwarves. Muhitan, the ocean goddess, is the god of the Balreskans. Adolebis, god of the hunt, is the god of the Nebskoslavs. Ontum, the void god, is the god of the Vologdans."
 elven: "Elven"
  twin_dragon: "Twin Dragon"
    twin_dragon_religion_desc: "The core philosophical nature of the Twin Dragon is of universal order, harmony, and  legalism. This ideal stems from the concept that everything follows a certain natural order, and such natural order is to be obeyed; else, it will lead to catastrophy. This concept is deified in the heavenly dragons Sen and Lyn, who are believed to guard and maintain the mortal world.\nThere are also individuals, chosen by the dragons, called "Celestial Matrons". Each Matron is believed to have a certain portion of the world to look after and keep orderly. The most famous of these Matrons is Sareariel, though others are known to wander Rathnir in hopes of establishing their rule."
  ashuran_pantheon: "Ashuran Pantheon"  
   ashuran_pantheon_religion_desc: "The Ashuran Pantheon believes that the Dune Elves originated from grains of sands in their original homeland. They believe that these grains of sand were blown across the ocean to Ashura, where the goddess A'ashia gave them life. Other gods are worshipped, but A'ashia is given special attention as progenitor of the dune elves."
  asitir: "Asitir"
   asitir_religion_desc: "Asitir believes the world is composed of one thing, and that the universe is, in a way, the body of a deity, and everything that exists is a modification and ramification of this body. Nothing was created, because the Universe-Spirit gave birth to itself, creating the possibility of its own existence. The first thing to emerge from this body was a dualism, an opposition between the nothingness and the everything, being and non-being: a dualism that later evolved into the opposition between light and dark, life and death, abundance and scarcity. To the Asitir, there is a great equilibrium in this world, and every tragedy that happens in nature has the purpose of creating and equilibrium, counteracting a miracle, a blessing. The Universe-Spirit actualizes itself, trying to reach a perfect equilibrium in its being.\nThe faith emerged from the traditions of the nomadic Seraan, whose civilization has become settled and then returned to great nomadic caravans many times. Their primary god, who they consider to be the personification of the Universe-Spirit, is named Asi, though the Asitir faithful believe that meaningful communication with gods is near impossible."
 feybound: "Feybound"
  sanderosa: "Sanderosa"
   sanderosa_religion_desc: "Vastallos is home to hundreds of distinct native religious traditons. Sanderosa is only one of these, but for the purpose of simplicity shall stand as the representation of all native faiths. Typically, these religions include a reverence of nature, particularly the belief that nature must be cared for and nurtured, just as people must nurture eachother."
  willowpact: "Willowpact"
   willowpact_religion_desc: "Long ago, the Miremen had their own gods. Long ago, the Miremen were pushed to the brink of extinction by the Sagaviri Empire.\n\nNow, with the Sagaviri empire shattered, the Miremen turned to the Fey of the Willows for revenge. In exchange for becoming their servants, the Fey of the Willows granted the Miremen powerful magics, and bent the land to obey the needs and fury of the Miremen."
 ummarnan: "Ummarnan"
  ardat_lily: "Ardat-Lily"
   ardat_lily_religion_desc: "Daini (commonly known to outsiders as "Ardat Lily" or "Ardatism") is centered around the teachings of the prophet Dain, who is revered as the religion's founder. Central to the faith are the gods Ardat Lili and Astar Mor, who are personifications of the moon and the sun respectively. The world of Rathnir is taught to have been created by these gods, with Ardat Lili as its mother and Astar Mor as its father.\nOutsiders commonly claim that Daini is simply an excuse to have temple prostitutes, but they simply fail to understand the divine nature of sex and love."
  cardinalism: "Cardinalist"
   cardinalism_religion_desc: "Cardinalists believe that the four main Deities each balance out the others as guardians of the cardinal directions, and if one is angered, they may abandon their duties as guardian of the Great Balance, throwing the world into disarray. The Great Balance is the balance of the four cardinal directions, a delicate and fragile system that could collapse if one of the gods become angry. The Cardinalists worship and appease their gods by performing sacrifices and other rituals in their names on special occasions in order to keep them satisfied."
 philosophies: "Philosophies"
  lotus_doctrine: "Lotus Doctrine"
    lotus_doctrine_religion_desc: "I love philosophy and religious tolerance."
 sparwood_group: "Sparwoodite"
  vinaestre: "Vinaestre"
    vinaestre_religion_desc: "All souls experience Vinaestre- the echos of greatness. Great men, heros, are sent upon us from the heavens, and strengthen us all by their bravery. We emulate these heros, and when they walk among us we raise them up as Kings.\nVinaestre is a folk religion in Sparwood, commonly associated with the tribal roots and hero-worship that the continent is famous for."

