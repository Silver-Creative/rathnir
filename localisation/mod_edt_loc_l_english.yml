 central_andornic: "Central Andornic"
 essukdalad_nation_title: "Proclaim Theios-Essukdal"
 essukdalad_nation_desc: "The peoples of Essukdal are lost. Ever since the humilliating defeat of Yimmu-Audal at the hands of the Escharians and the subsequent miserable years of occupation, Essukdal has lacked unity, stability and, above all, purpose. Drowning in their hubris, many have tried, citing the need to band around false gods or common heritage. And then, they all failed. It appears that only we know the unabolishable truth"
 astyllean_nation_title: "Proclaim the Empire of Astyllea"
 astyllean_nation_desc: "The balance of power is destroyed, and we stand triumphantly over its ashes. There are still old men and women living under our banners who remember the times we were but an insignificant, petty duchy in a forgotten corner of vast Alteniquia. Oh, how far we have come"
 soleannan_nation_title: "Proclaim the Soleannan Empire"
 soleannan_nation_desc: "ameno"
 aldoviri_nation_title: "Form the Aldoviri Nation"
 aldoviri_nation_desc: "For decades, the lands of Aldovir have known little peace, being embroiled in war after war, rebellion after rebellion. Those who ruled over it have always sought to bring others under their banner, to stand stronger and mightier in the name of some token ideal, be it common faith, heritage or some other nonsense. All of them have failed, and we refuse to follow in their footsteps. Aldovir will be united by our hand, not for bringing together some handful of devouts, or peasants who speak similar tongues, but because this is our land - our shared homeland! - and together we can defend it against the scourges of Rathnir, faith and heritage be damned."
 sagaviri_nation_title: "Rekindle the Flames of Sagavir"
 sagaviri_nation_desc: "Nearly a century ago, the Empire of Sagavir fell. Pestered by a relentless onslaught of natural disasters and high troubles, the once-great state crumbled on its own weight and gave way to a myriad of squabbling successor states. At the time, the people of Aldovir thought that these newly heralded nations would pave the way to a bright future, that they would make good of their renewed hope and restore prosperity to the land. Oh, how wrong they were. After many dreadful decades of near-sighted leaders devastating the realms over petty causes, barbarian invaders from beyond the seas reaping our livelihoods and many such tragedies, we have perservered and now stand at the precipice. It is time to rekindle the old Empire, resume our glorious days and put an end to this pitiful age."
 uldarashi_nation_title: "Form the Uldarashi Nation"
 uldarashi_nation_desc: "whiskey wet dream"
 audalad_nation_title: "Restore Imperial Grace"
 audalad_nation_desc: "It has been a harsh century for the Audalad people. No sooner were we at our zenith, our banners flying proudly above such faraway lands as Ardat and Soumere did the Escharians see our empress' corruption as an opportunity and invade, seizing our sovereignty and plunging us into decades worth of misery and unrest. Yet, despite all of that, we have prevailed. The shores of the Geshem Bay now lie green and lush with life, as do those of the Gray Bay; the Western Territories have been returned to the fold and the unruly Anòshphites have been firmly educated of the benefits of our rule. We have, beyond doubt, outgrown our dark ages, and it is time we look the part"
 carnian_nation_title: "Proclaim the Caeronate of Carn"
 carnian_nation_desc: "placeholder"
 myyraa_nation_title: "Rein in the Mýyraa"
 myyraa_nation_desc: "For millenia, petty clans and warrior houses have dominated mýyraa society. There are no states beyond those shallow husks erected by the squabbling warlords, and even those are built not to last against onslaughts from outsiders who would see us all mounted on pikes, but to endlessly jockey against one another. For this, we have undoubtedly suffered. Throughout the ages, outsiders - be they Sagaviri, Reyllean or some other damned breed - have ruthlessly exploited our disunity, pummeling us at every turn and reducing our once flourishing civilization to the wreck that remains. This cannot continue."
 tyyraa_nation_title: "Rein in the Týyraa"
 tyyraa_nation_desc: "For millenia, petty clans and warrior houses have dominated týyraa society. There are no states beyond those shallow husks erected by the squabbling warlords, and even those are built not to last against onslaughts from outsiders who would see us all mounted on pikes, but to endlessly jockey against one another. For this, we have undoubtedly suffered. Throughout the ages, outsiders - be they Sagaviri, Reyllean or some other damned breed - have ruthlessly exploited our disunity, pummeling us at every turn and reducing our once flourishing civilization to the wreck that remains. This cannot continue."
 miremen_nation_title: "Unite the Miremen"
 miremen_nation_desc: "It is done. For millenia, our peoples have remained separate and dreadfully disunified-- first, by whether to take refuge in the murky swamps of Mhýr or in the ethereal arms of the feyking of Thýr; then, by remaining under the unworthy grip of the petty warlords that poisoned our civilization. No more. If we are to stand against the hounds beyond, we will do so together; as one."
 lausarian_nation_title: "Form the Lausarian Nation"
 lausarian_nation_desc: "For generations, our kin have been slowly seduced by Audalad heathans. Year after year, we have seen our ancestral lands eaten away by the ascendant Theioniki. We must unite the Lausarii behind us, or else our people will soon cease to be."
 anoshphite_nation_title: "Form the Anòshphite Nation"
 anoshphite_nation_desc: "<ponteos>"
 denthrosi_nation_title: "Form the Denthrosi Nation"
 denthrosi_nation_desc: "tbd"
 dracade_trollgard_nation_title: "Unite the Kingdoms of Dracade and Trollgard"
 dracade_trollgard_nation_desc: "Vastallos is a grand arena of nations, perhaps even moreso than any other corner of Rathnir. The cutthroats that haunt the courts and halls are as unforgiving as the land itself, and in a land mired in self-interest and distrust, true allies are rarer than gems. Yet, we have found one. The realms of Dracade and Trollgard may appears to outsiders as no more remarkable than simple neighbours but that cannot be further from the truth; this we will show the world, as we vow to stand together no matter what."
 ilivian_negotiations_title: "Request negotiations on Ilivian"
 ilivian_negotiations_desc: "The Carnian state, newly freed, has conquered our former town of Ilivian. Maybe they could be convinced to give it back."
 reyllean_civil_war: "Reyllean Civil War"
 make_them_pay: "Make them pay!"
 make_them_pay_desc: "The carnians are refusing to give us back Ilivian. Let's show them not to try and steal our rightful land."
 the_black_library: "The Black Library"
 the_black_library_desc: "With the help of the Black Library, Praestenia is slowly growing, and attracing a more sizeable population of workers to extract profit from the land."
 grand_gathering_abolished: "Grand gathering abolished"
 grand_gathering_abolished_desc: "Upon the ascension of Caeron Daria, the institution of the grand gathering was abolished. The lessened bureaucratical strain gives our country a slight edge compared to before."
 carnian_liberation_army: "The Carnian Liberation Army"
 carnian_liberation_army_desc: "Proud supporters of the Carnian independence movement, roaming the countryside and bolstering the morale of our troops."
 bolstered_independence_movement: "Bolstered independence movement"
 bolstered_independence_movement_desc: "With the full support of the Carnian state behind them, the Carnian Liberation Army is waging an organized guerilla war against the Reyllean state, weakening them and strengthening us in the process."
 province_wayshrines: "Wayshrines"
 province_wayshrines_desc: "Shrines to Aegmer have been built along the roads, bolstering support for missionaries."
