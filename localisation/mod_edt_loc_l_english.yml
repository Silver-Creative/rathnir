 A06_ideas: "Fuciwan Ideas"
 A06_ideas_start: "Fuciwan Traditions"
 A06_ideas_bonus: "Fuciwan Ambition"
 A06_marshalling_the_wastes: "Marshalling the Wastes"
 A06_marshalling_the_wastes_desc: "Ever since our landing, the deserts have become our home and our greatest defense. Many unwary travelers have lost themselves in the wastes without a guide, and in times of strife this becomes our boon."
 A06_hardy_people: "A Hardy People"
 A06_hardy_people_desc: "Life in the desert is hard. Among deserts, our wastes are the harshest. To survive- and thrive- where we do requires a tougher kind of person."
 A06_elven_voyages: "Legacy of the Elven Voyages"
 A06_elven_voyages_desc: "The Fuciwans came from the fortunate arrival of the Dune Elves to Altaniquia. When their ships crashed on our shores, the Fuci nomads took them in. Generations later, there is no Fuci or Dune Elf, only the Fuciwans! We remember our seafaring heritage, and embrace it."
 A06_unbroken: "Resiliance Unbroken"
 A06_unbroken_desc: "The Fuci were pushed out of their homelands by the fledgeling Audaladae and the Sagaviri, leaving only a narrow strip of treacherous desert for us to live on. No more! This is our home, and we will fight to remain until every last one of us is dead. With our ferocity (and no small amount of luck) we have clawed our rightful lands back... even if the Fuciwans who live there now call themselves by foreign names."
 A06_bloodmarket_diamonds: "Diamonds in the Bloodmarkets"
 A06_bloodmarket_diamonds_desc: "It is no secret that Fuciwa has its hands in bloodier trades. While pious Sakrelists condemn slavery and most nations of reason detest uncouth mercenaries, both trades find their home in our cities. To keep their trade alive, slavers and mercenaries send their best and brightest to defend us... for the right prices, of course. A pound of flesh for a shaving of gold."
 A06_dune_elf_heirs: "Heirs of the Dune Elves"
 A06_dune_elf_heirs_desc: "While many decry us as simple bandits, choking on sand, we know ourselves as the heirs of the Dune Elves, whose kingdoms in Ummarnu were known for their high culture and the everlasting glory of their armies."
 A06_far_from_prying_eyes: "Far From Prying Eyes"
 A06_far_from_prying_eyes_desc: "There is no better place to hide than Fuciwa. Nobody thinks to look. Those that do tend to get lost themselves. Like the mirages of the desert, our enemies will find themselves chasing secrets that simply never were... or, are there no longer."
 A07_ideas: "Coltmaeran Ideas"
 A07_ideas_start: "Coltmaeran Traditions"
 A07_ideas_bonus: "Coltmaeran Ambition"
 A07_flexible_treaties: "Flexible Treaties"
 A07_flexible_treaties_desc: "Coltmaere exists in an eternal dance with death. Surrounded by stronger powers, Coltmaere survives in a constant state of signing and resigning treaties to keep foreign powers' eyes off of us."
 A07_a_yellow_memory: "A Yellow Memory"
 A07_a_yellow_memory_desc: "Despite our estrangement, the people of Coltmaere are closely related to the Bardonians and Ryzani. Perhaps we could learn a thing or two from their warrior spirit..."
 A07_keshnev_trade_union: "Keshnev Trade Union"
 A07_keshnev_trade_union_desc: "Keshnev was founded as a trading colony of the Valdreach Imperial Republic. Our contacts from this period remain intact, allowing us to trade along far-off trade routes."
 A07_legacy_of_the_witch-hunts: "Legacy of the Witch-Hunts"
 A07_legacy_of_the_witch-hunts_desc: "While we no long hunt witches and other evil sorcerers, all magic practitioners in our land know that the law remains in effect. If nothing else, it puts the people at ease."
 A07_phagosian_ferries: "Phagosian Ferries"
 A07_phagosian_ferries_desc: "Coltmaere's islands are small, numerous, and far flung. To this effect, Coltmaeran boats are fast and made for efficient transport. If only this made them better in battle..."
 A07_hjuzairar: "Hjuzairar"
 A07_hjuzairar_desc: "Due to the isolated nature of Coltmaere's islands, foreign nobles tend to build estates here. We allow them to, of course, for a hefty price."
 A07_iceshapers: "Iceshapers"
 A07_iceshapers_desc: "Keshnev's ice shapers are strange indeed. They turn summer heat into winter snow, and claim to see the future in the ice... Despite our nominal ban on witchcraft, it may be wise to sanction their divination practices."
