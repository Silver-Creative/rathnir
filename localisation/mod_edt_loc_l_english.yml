 bandits_dealt_with_tt: "If we deal with the bandits swiftly and effectively, it's likely we won't see them for a long time forwards."
 marauding_bandits_tt: "If we don't deal with the bandit problem swiftly, they may get bold and attack again soon."
 flavor_gr.1.t: "BANDITS!"
 flavor_gr.1.d: "Reports of bandit attacks near the city of [targeted_province.GetName] are shaking up the populace in [Root.Capital.GetName] - according to rumors, the bandits may have crossed over from [neighbor_country.GetName] to savagely attack our cities before retreating back to safety. We need to do something about this before panic starts to take hold in the country."
 flavor_gr.1.a: "They came from [neighbor_country.GetName], clearly this is all their fault. Demand compensation for the attacks."
 flavor_gr.1.b: "We need to deal with it ourselves."
 flavor_gr.1.c: "It's really not a big deal."
 flavor_gr.2.t: "Bandits?"
 flavor_gr.2.d: "The bastards in [origin_country.GetName] are apparently claiming - in all their insolence - that we sent bandits over the border to their petty little country, to raid them and cause devastation in their lands or some such. How dare! Such a grave insult can simply not go unpunished; we need to respond as soon as possible and make our stance on the matter abundantly clear."
 flavor_gr.2.a: "We didn't do anything - they will pay for insulting us!"
 flavor_gr.2.b: "Let's be diplomatic about this - they're clearly suffering, we need to help them recover."
 flavor_gr.2.c: "It's their fault - they deserve it."
 nieden_adventurers.1.title: "Winds of Adventure"
 nieden_adventurers.1.desc: "Nearly four decades ago, the Empire of the Soleannan fell. That great work, one cultivated by generations of dutiful Escharii, Solerii and many more such sons of Solaris.. was turned to ash in the blink of an eye. Banners fell, armies dissipated and nearly all of Asterien - the heartlands of the old Empire - ascended to the Luminarium, the Escharians' promised heaven-- or so they claim, at least. Nieden, the lands they have governed since time immemorial, was suddenly without crown or country and the many lords of Rathnir were quick to notice. Lords disgraced in petty wars, adventurers looking for a feat of renown, downtrodden peoples seeking a new home and expeditions made to retrieve old artifacts and riches-- they all poured into the dead soils of Nieden and, eventually, found their own little slice of land to call home... The Dandelion Wars have ended. Nearly all of Rathnir lies wrecked, exhausted or otherwise depleted-- yet we, harmless folk in ruined lands, have thankfully managed to dodge the flames of war. With the world at war, few rulers - if any - ever considered it to be prudent to waste resources on wrangling a poor adventurer's ill-gotten gains from their weak hands. There was a war to fight, armies to marshall and cities to siege-- but that is no longer the case. As the great realms of Rathnir heal and rebuild, so too will they begin to let their eyes wander, to size up their neighbours once more-- if we are to be caught in their sight unprepared, the consequences would be disastrous."
 nieden_adventurers.1.a: "The veil is thin and will not last forever. Let's make the most of it while it lasts!"
 nieden_adventurers.1.a.tooltip: "We will be protected against declarations of war from non-niedene nations until the year 1544, or until we reform our country."
 nieden_adventurers.1.b: "The veil is thin and will not last forever. We need time to mourn."
 nieden_adventurers.1.b.tooltip: "We will be protected against declarations of war from non-niedene nations until the year 1544, or we make ourselves known to the world."
 nieden_adventurers.1.c: "We have our own problems to worry about."
 nieden_adventurers.1.c.tooltip: "So long as we stay at peace, no nation will disturb us until the year 1544."
 nieden_adventurers.1.d: "The veil does not protect us. Let us reclaim Kaheren!"
 nieden_adventurers.2.title: "The Winds Quieten"
 nieden_adventurers.2.desc: "u done messed up !"
 nieden_adventurers.2.a: "The veil is broken..."
 nieden_adventurers.2.a.tooltip: "We are no longer protected against declarations of war from non-niedene nations."
 nieden_adventurers.3.title: "Niedene Rebirth"
 nieden_adventurers.3.desc: "u can colonize now gongerts"
 nieden_adventurers.3.a: "Let us reclaim our birthright!"
