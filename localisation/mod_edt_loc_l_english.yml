 A21_ideas: "Lirgalyn Ideas"
 A21_ideas_start: "Lirgalyn Traditions"
 A21_ideas_bonus: "Lirgalyn Ambitions"
 A21_a_brand_new_home: "A Brand New Home"
 A21_a_brand_new_home_desc: "For ages, the kin and friends of the Seraan and the faithful of Asitir have endured suffering and punishment from all the peoples in Rathnir. No more! Lirgalyn of all ages, genders, and origins flock towards the City Guard, vowing to protect the Lunar City-State until their last breath. Never shall Lirgal fall again - neither through conquest nor through sorrowful abandonment. We will see to it."
 A21_masters_of_arcana: "Masters of Arcana"
 A21_masters_of_arcana_desc: "Whence does knowledge come? May it be the Light that shines upon all of the world? May it be the inner inclinations to understanding? Be it Deity or Man? That is a question to be answered by the greatest of philosophers and theologians - thankfully, Lirgal has plenty of both."
 A21_land_beloved_by_all: "A Land Beloved By All"
 A21_land_beloved_by_all_desc: "It is not only Lirgalyn who flock to the protection of the Lunar City-State. From all corner of the words, Mercernaries raise their weapons high in a bid to protect the City-State from certain peril. The favour of all fighters of the world fall upon Lirgal."
 A21_seraani_diplomacy: "Seraani Diplomacy"
 A21_seraani_diplomacy_desc: "The Seraan have always been known for their diplomatic ability and prowess. Before the times of the Almadorian conquest, Olarã ruled not through fear, but through love. When walking through the city-scapes of Lirgal and being showered of niceties by eager Lirgalyn diplomats, how could one not fall in love again?"
 A21_busy_bee_like: "Busy-bee-like Dispositions"
 A21_busy_bee_like_desc: "None can accuse the Lirgalyn of slacking. Though certain structures may go unfinished and projects be put on hold indefinitely, the overall expansion and development of Lirgal never ceases, never stops - with Lirgalyn hands, construction is done in a fraction of second, and one cannot help but be amazed at their disposition. Will Lirgal ever stop growing?"
 A21_benevolent_tyrants: "Benevolent Tyrants"
 A21_benevolent_tyrants_desc: "The fist of Lirgal, even if made of steel, always wears the softest of velvet gloves. No realm subservient to Lirgal has any right to decry their position, for they know they could very much be in a worse state under any other realm. To be under the hand of Lirgal is better than to be crushed by the fist of any other country."
 A21_lirgal_stands: "Lirgal Stands"
 A21_lirgal_stands_desc: "The ages have hardened Lirgal. What was once a friendly and naive city-state has turned into an austere but gentle country. War has been studied, and war has been fought - Lirgal stood. The Lirgalyn population is ever so hardened, and Lirgal shan't ever see ruin again."
 carn_ideas: "Carnian ideas"
 carn_ideas_start: "Carnian Traditions"
 carn_ideas_bonus: "Carnian Ambition"
 carn_lestrian_red: "Lestrian Red"
 carn_lestrian_red_desc: "Many nations around the world lay claim to their own drinks and cuisine, but even among red wines Lestrian red is said to be unique. Brewed and fermented from the grapes that naturally dot the Carnian and Reyllean plains, it is a dark, hardy wine suited for the strongest of warriors - yet, simultaneously, it is slightly sweet, and bitter but not too bitter, falling into that perfect sweetspot that so many other wines and winemakers around the world wish they had achieved."
 carn_the_old_cults: "The Old Cults"
 carn_the_old_cults_desc: "No one exactly knows where the traditions, ideas and values that build the foundation of Aegmerism come from - and if they do, it’s likely that they’re atleast partly lying. Though the religion itself is not too old in comparison with some of its counterparts along the continent, certain signs point to it being much older than we all can definitively prove. Within Carn this more often than not leads to certain strife regarding canonicity and historical rulers, but outside it? Well, it certainly gives a certain sense of prestige and legitimacy, legitimacy that has a minor  but noticeable effect on the heretics around Carn."
 carn_lantine_legacy: "Lantine Legacy"
 carn_lantine_legacy_desc: "Within the history scrolls, Lant - these days more often known as saint Allantus - is identified as the first ruler of the Caeronate of Carn, several centuries in the past. Being the first ruler, his ideas and values hold a certain sway over the more modern Caerons, who look back to him and his immediate successors with optimism, hope, and as signs of better times. Or, when times are good, examples that can be pointed to in order to drive home the point that those good old times never really faded."
 carn_the_erneraevis: "The Erneraevis"
 carn_the_erneraevis_desc: "The Erneraevis - the elite core unit of the Carnian army - is like no other. Trained from birth to be loyal servants of the Caeron serving him faithfully until death, they do not know the word dishonor and would gladly take their own lives if it meant the Caeron lived, something that can’t be said for most normal soldiers. Within the army they strike fear on the battlefield, and at home they can often be seen in their secondary role as protectors of the Caeron himself, walking alongside him on the streets as his personal guards at all times."
 carn_port_of_lestria: "Port of Lestria"
 carn_port_of_lestria_desc: "What is the point of building a city on a coast if not to make trade with the world at large? Lestria is by no means a small city compared to some of its compatriots around the world, but it could always be larger. It could always exert more influence on the seas, attract more merchants, have more traders flock in its streets - by making the expansion of Lestria a priority above most of everything else, we signal to the world that not only are we powerful as we are now, but that we will only grow in power as time goes on."
 carn_the_blue_flower: "The Blue Flower"
 carn_the_blue_flower_desc: "Within the Aegmerist faith, the Blue Flower, existing as a counterpart to Aegmer, represents the good that exists in the world - it is a representation of the lawful order of things. That even in chaos, stability exists, and that good will inevitably triumph over all evil. Our citizens, in their dark times, look to the Blue Flower for guidance, praying, hoping, believing that things will eventually turn out good - and as they do, for after every rain comes sunshine, so grows the influence of the Blue Flower. It gives people hope, an emotion that rarely if ever trumps any other."
 carn_divine_touch: "Divine Touch"
 carn_divine_touch_desc: "\"
 A39_ideas: "Týrian Ideas"
 A39_ideas_start: "Týrian Traditions"
 A39_ideas_bonus: "Týrian Ambition"
 A39_indigenous_inhabitants: "Indigenous Inhabitants of Týria"
 A39_indigenous_inhabitants_desc: "We have inhabited Týria since before the Lapidosa was even a nation. It has always been our land and now, in the face of the growing threats around us, our people will fight even harder to ensure that it will continue we will let them know that no Týrian will let our ancestors' work, which was paid in sweat and blood, go down with out a fight."
 A39_tyrian_minds: "Týrian Minds"
 A39_tyrian_minds_desc: "The Swampfolk were fathered and brought up by our great scholars and philosophers, they have adopted many of our customs and been influenced by much of our culture especially in the arts of smithing and carving. We are their teachers, our ingenuity is copied by the Miremen and the other cultures. Our great minds shall continue to work on the next assignments, the student shall not overcome the teacher this time, not a Týrian one."
 A39_in_the_shadow_of_giants: "In the Shadow of Giants"
 A39_in_the_shadow_of_giants_desc: "Our city-states have been ceremoniously at war with each other as far back as our oldest scrolls. Our warriors  are accustomed to wars and so are their sons, brought up to fight for their cities. If any wretched foreign invader dares to step on our soil, our numbers will swell, united as one! When we fight each other, our true strength does not show. When they march upon us, it will."
 A39_skilled_in_the_arts: "Skilled in the Arts"
 A39_skilled_in_the_arts_desc: "Our ancestors were prideful of their artworks and creations. Even today, we export our goods across the seas to those who can afford to pay the price. Our artisans have improved their techniques for hundreds of years, a little push with the aid of our coffers can lead to our crafts to flourish once again."
 A39_terror_upon_the_sivan: "Terror upon the Sivan"
 A39_terror_upon_the_sivan_desc: "Situated in the crossroads of the Sivan, our peoples have become accustomed to all things at sea. Our fleets match those of the great seafaring nations across the wide waters as prove to be formidable opponents to any foe we may face. Our excellency at sea has allowed some of our destitute or those seaking adventure to take to the waves and make a fortune out of plundering our competitors."
 A39_three_cities: "The Three Cities"
 A39_three_cities_desc: "Our three main cities will not be able to fight with sword and spear alone. Flexible diplomacy is key to any nation, new or old. It is our duty to train our diplomats so that they may sway our allies and get their continued support. Allies are invaluable and as such our silver-tounged diplomats will become our tools in gaining such alliances."
 A39_devoted_to_sakrelith: "Devoted to Sakrelith"
 A39_devoted_to_sakrelith_desc: "Our faith has always been a pillar of our civilization, if our subjects do not follow our religion how can we expect them to follow us? It is imperative that we make great efforts in converting our new vassals and citizens. With man alone its impossible, but with Sakrelith its possible."
 lt_ideas: "Lausarii Tribal Ideas"
 lt_ideas_start: "Lausarii Tribal Traditions"
 lt_ideas_bonus: "Lausarii Tribal Ambition"
 lt_farene_huntsmen: "Farene Huntsmen"
 lt_farene_huntsmen_desc: "The Farene tribe is one of great hunters. In our time of crisis, these great hunters readily come into military service."
 lt_auraion_cavalry: "Auraion Cavalry"
 lt_auraion_cavalry_desc: "The drylands around the gulf of Auraion have given rise to a very particular breed of horse"
 lt_raids_of_yore: "Raids of Yore"
 lt_raids_of_yore_desc: "There was a time, long ago, that the Lausarii suffered no kings and raided indescriminantly along all of the Phagosean's coast. Those days are long gone now, but some still leave shore in persuit of this nigh-mythic past."
 lt_thrift_of_the_gold_coast: "Thrift of the Gold Coast"
 lt_thrift_of_the_gold_coast_desc: "The coast around the city of Selak is sometimes called 'The Gold Coast'. While many origins of this name have been proposed, none have particularly stuck as explanations. At least their mayors know a thing or two about coin."
 lt_eastern_flowing_river: "An Eastern-Flowing River"
 lt_eastern_flowing_river_desc: "It is traditional that the Soléa are only baptized in rivers that flow eastwards, toward the sunrise. While this can be a cause for concern in places far from such geography, we have been blessed by the existence of the Kiasta river. There is no need for lengthy, arduous pilgrimages for converts."
 lt_edge_of_oblivion: "Edge of Oblivion"
 lt_edge_of_oblivion_desc: "Death is certain. Death is the only certainty. As years have passed, it had become clear that our time is soon. Year after year, we have been pushed further and further by the Audaladae. Soon there will be nowhere left to retreat to. So here, we stand, for we have nothing more to lose."
 lt_lost_tribes: "The Lost Tribes"
 lt_lost_tribes_desc: "It has been many years since the Idani, the Geshemi, and the Jagdasians came to the continent. As these new powers grew, they came to include many of our people. Over time, our kin have forgotten their roots. Should we ever come to rule them again, let us not hesitate in reminding them of our kinship."
 A50_ideas: "Lausarii Ideas"
 A50_ideas_start: "Lausarii Traditions"
 A50_ideas_bonus: "Lausarii Ambition"
 A50_farene_industry: "Farene Industry"
 A50_farene_industry_desc: "As we seek to reform our economy, the traditional lifestyle of a huntsman is no longer profitable. Let us reallocate their skills to more substantial trades."
 A50_violet_breeze: "The Violet Breeze"
 A50_violet_breeze_desc: "With the capture of vast open lands, many ranches have been established to breed the now highly-demanded Auraion Lightfoot. The new stock from these ranches are healthier than their wild cousins. The blur associated with a charging regiment of Lausarii cavalry has given rise to a new nickname"
 A50_sea_second_home: "The Sea, Our Second Home"
 A50_sea_second_home_desc: "There is nothing like the thrill of the hunt. While hunting on land has become unsustainable, the hunt on the sea has only begun. Perhaps those glory days of maritime raiding were more than just myth?"
 A50_more_than_thrift: "More than Thrift"
 A50_more_than_thrift_desc: "Brutal efficiency. Nothing less is acceptable for governors trained in the Selak Acadamy. Every coin of tax is collected, every bit of land survayed, every account scrutinized. Some may call it cruelty, of course, but they simply don't have thrift."
 A50_hand_of_solaris: "The Hand of Solaris"
 A50_hand_of_solaris_desc: "The Kiasta is one of five bodies of water that flow into the Auraion. The Kemitha, Elisin, and Vassos also flow into the sea. In recent years, the Auraion Gulf and its tributaries have been stylized by our mapmakers as ann outstretched hand, with the Kiasta as its pinky and the northern Ionesi inlet as its thumb. Regardless of artistic stylizations, the calm waters- perfect for trade and the production of ships- does, at times, make it feel as if we were living in Solaris's own palm."
 A50_death_defied: "Death Defied"
 A50_death_defied_desc: "We have lived! The heretics and heathenous barbarians have been turned back! Death comes still, but not for us! Not this day!"
 A50_kjastii_reborn: "The Kjastii Reborn"
 A50_kjastii_reborn_desc: "In retrospect, we regret razing the city of Kjásthejm. If Hákon hadn't been captured and enslaved, he would have never able to found his heathenous state. He would have never dismantled countless tribes in favor of his Theios. Our kin would have never been seduced into the barberous culture of the Audalads. The past, however, is the past. While we cannot undo the damage he has done to our culture, we can heal from it. As apostates return from their sin and the Theióniki realize the emptiness of their culture, let us welcome them home as long-lost kin. The Kjastii may have vanished in fire and an orange flood, but under our care they will return."
