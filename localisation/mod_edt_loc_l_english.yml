l_english:
 lirgal_happs.1.t: "Rumours of a Caravan"
 lirgal_happs.1.d: "Rumours of a caravan have travelled the countries of Alteniquia. Coming from the continent of Syltör, it seems to be made of a variety of peoples, all following a similar creed and faith. On their way, they have befriended and traded with all Alteniquians, but quickly left every city and town they passed through."
 lirgal_happs.1.a: "A most curious happening."
 lirgal_happs.1.a.tt: "The Second Seraan caravan travels through Alteniquia, hoping to find a new land to inhabit."
 lirgal_happs.t.201: "The demand of the Lirgalyn"
 lirgal_happs.d.201: "Though people talk of Meydan with no end, everyone knows that Meydan is no better than a wasteland. Moreover, a group of new peoples has settled in its land - they claim to have found ruins of a city of yore that belonged to them, and wish to develop the land."
 lirgal_happs.2.a: "Pah! That land is more trouble than it's worth, either way. Let them have it!"
 lirgal_happs.2.b: "A new city arises? That will probably turn out better than this mess ..."
 lirgal_happs.2.c: "Let the Lirgalyn have their land. There is no harm in giving, sometimes."
 lirgal_happs.2.d: "May the Lunar City-State of Lirgal thrive!"
 lirgal_happs.2.e: "A new city, and it demands autonomy? Perhaps - but we shall limit it."
 lirgal_happs.2.f: "A new city arises. Glory to the City of Lirgal."
 lirgal_happs.2.g: "Those are [Root.GetAdjective] lands and they shall remain [Root.GetAdjective] lands!"
 lirgal_happs.4.t: "Lirgal calls for aid!"
 lirgal_happs.4.d: "A delegate from the lunar city-state of Lirgal arrives at our doorstep, panting and on the verge of tears; beloved [Root.Monarch.GetTitle], they say, Lirgal is under attack - and they need our support. Carefully unrolling the parchment they carry, it reads as following.\n\n 'Forgive our haste with this missive, but you must understand that the situation is urgent. Merely a couple days ago, foreign agents entered our borders, seeking to subjugate us, destroy our culture and raze our city - long have we known each other, and we will only ask this of you once"
 lirgal_happs.4.a: "We have no choice but to accept."
 lirgal_happs.4.b: "They can deal with it themselves."
 redCultSac.1.a: "woah"
 redCultSac.1.b: "ok"
 soleannen_spirits_title: "Soleannen Spirits"
 soleannen_spirits_name: "Soleannen Spirits"
 soleannen_spirits_army: "Soleannen Spirits"
 waahi_conquest_title: "Breaking into the Phagosia"
 waahi_conquest_desc: "Traders in the inner chambers of government and in the street have become tired of Kawalapua having self governance and imposing tariffs upon their trade. We want to have direct control and therefore give our clients better prices and easier access to our goods."
 plan_the_arm_title: "Forearms of Denthros"
 plan_the_arm_desc: "we must move before Theionikos does to claim and control what they call 'The Arm'"
 fort_madinatta_title: "The Southern Fort"
 fort_madinatta_desc: "Ever since Essendor allied with Asturcia he demolished the fort in Ravenito, we will need a better fort in the south to ward of the Asturcians and their envy"
 Dreams_of_Empire_title: "Dreams of Empire"
 Dreams_of_Empire_desc: "Ever since the devastating invasions and occupation by the Ardatian Empire, our political class have dreamed of being the major power of our region to prevent such a thing from happening again. Lets work to accomplish that shall we?"
 resubjugation_title: "Resubjugation of Griffenview"
 resubjugation_desc: "Before the invasions of Ardat, Griffenview was a major fortification in Asturcia and served as a safe place for the political classes to hold out during times of crisis."
 Fort_Ravenus_title: "Fort Ravenito"
 Fort_Ravenus_desc: "In ancient times Fort Ravenito was an Asturcian fort, since then it was seized by the Theiosists in the Carvayian revolution where it held out until the government capitulated to the overwhelming public support the movement had."
 Establish_the_Asturcian_Church_title: "Establish the Church"
 Establish_the_Asturcian_Church_desc: "The Asturcian religion was imported from Sironia due to close contact, but until recently we have followed mostly the Azethvir line. We should establish our religious independence from Azethvir."
 The_Road_Less_Traveled_title: "Road Less Travelled"
 The_Road_Less_Traveled_desc: "We shall take the road less travelled to conquer the region descending from the mountains onto our unsuspecting foes."
 Asturcian_Epics_title: "Asturcian Epics"
 Asturcian_Epics_desc: "It is told in the Asturcian Epics of our rivalry with Carvay and the trials and tribulations that came out of our conflict. Lets settle this once and for all!"
 Kawalapuan_Campaign_title: "Kawalapuan Campaign"
 Kawalapuan_Campaign_desc: "Our last barrier to conquering the continent is in our way, they shall stand no chance."
 Final_Stretch_title: "Final Stretch"
 Final_Stretch_desc: "This is the final stretch of our conquests before seeing into the new world born in the ashes of our conquests."
 Stab_at_the_Dragon_title: "Stab the Dragon"
 Stab_at_the_Dragon_desc: "Dracade and Stensta are states born out of the ruling elites that used to work alongside the oppressive Ardatian colonial regime. They shall be no more."
 Strike_TrollGuard_title: "Strike Trollgard"
 Strike_TrollGuard_desc: "The hills and plains before the mountains of Knossos represents the reflection of our own land, and the oppressed peoples of this region reflect the struggle of all Vastallosi to be free from foriegn tyranny."
 Knossian_Traitors_title: "The Traitors"
 Knossian_Traitors_desc: "The Knossians worked alongside the oppressors and shall be wiped from existence and every historical record of them shall be burned. no example of their evil deeds should remain on this land."
 Prepare_The_Reconquest_title: "Prepare the Reconquest"
 Prepare_The_Reconquest_desc: "We must take back our country for our own. Our people must be united in purpose and drive."
 Reconquer_Knossos_title: "Reconquer Knossos"
 Reconquer_Knossos_desc: "We now must take back our barbarous Countryside and then introduce our Revelations to them!"
 flavor_sironia.1.t: "Land negotiations"
 flavor_sironia.1.d: "Merely a couple decades ago - still fresh within the memory of every Sironian - we lost. The Reylleans, moving out of Rhodia like an unstoppable horde, pillaged and destroyed our country until finally, at the cities of Althivir and Namarrak, they were stopped for good. Negotiating is pointless - they are brutes, wild savages who do not care for morals and do not have a word for honor. Yet, we have just been presented with a golden opportunity. The duchy of Carn, previously under Reyllean management, has now broken free, and in their independence moves they managed to get a hold of the sea-side port of Ilivian, one of the last cities conquered by the Reylleans in that war so many years ago. They seem significantly more amenable to negotiations than their former Reyllean overlords, and may indeed seek to impart some manner of revenge on their old overlords by giving more power to their biggest rival. We can send a negotiating party to Lestria, in order to start discussions on the topic of Illeviane; maybe they can even give us some compensation for the decades-long occupation, in order to help us rebuild the still war-torn city."
 flavor_sironia.1.a: "Send the negotiating party - what’s the worst that could happen?"
 flavor_sironia.1.b: "There’s no point. We’ll simply take the city by other means."
 flavor_sironia.2.t: "Negotiations continue"
 flavor_sironia.2.d: "After a long journey up through the continent, our negotiating party has finally returned - bearing bad news. The Carnians - clearly inheriting several despicable qualities from Reyllea and subverting our good expectations for them in the process - want money. They want us to pay for our own lands. How despicable! As the news enters the courtroom it slowly starts dissolving into chaos, and arguing, until Archon [Root.Monarch.GetName] finally puts a stop to things and demands silence. We will examine our options carefully, they say. And we will not be swindled for more than that town is worth."
 flavor_sironia.2.a: "Give in to their demands. Ilivian is worth the price."
 flavor_sironia.2.b: "Those dogs! They will pay for this!"
 flavor_kaithrat.1.title: "The Watchers, Rebuilt"
 flavor_kaithrat.1.desc: "Even in the times of Great Sagavir, most of Aldovir's reputed ports were located in the Borean Gulf, and for good reason. Sironia's lands were, for many ages, uniquely unsuitable for sea trade, as the sharp mountains that hug their coasts made port construction a dreadful task. Mýrish raiders gave merchants in the Sea of Vanakunir no peace of mind, and the endless scum of the Karkaran Sea did much the same for the coasts of Thýr. Initially, Kaithrat fared little better, owing to its many mires and bogs, but as our noble ancestors raised bastion after bastion, our fortunes began to turn. Of these, no fortification was ever more fortituitous, grandiose or monumental as the Great Watchers — two solemn colossi, armed to the teeth within, stood guard over our straits, turning away any wandering pirate that thought to try their luck in these shores.\n\nSince then, however, our nation has fallen on hard times. Out of blind complacence, our great forts, on which so much of our pride rested, crumbled. Our treasures were stolen, our lands were seized, and the colossi fell..."
 flavor_kaithrat.1.a: "But now they have been rebuilt!"
 flavor_kaithrat.1.a.tt: "§GThe Borean Gulf is now protected from raids!§!\nThe shores of the Borean Gulf get '§YThe Watchers' Gaze§!' until the end of the game, giving"
 daria_takeover_1_tt: "The institution of the grand gathering continues unhindered."
 daria_takeover_2_tt: "The grand gatherings are abolished; we become a traditional monarchy."
 wedding_planned: "Preparations for the wedding - hopefully to happen in some months - will start."
 shame_overtakes: "The interaction in the court proves to be too much for [Root.Monarch.GetName] - in several days, he will be found dead in [Root.Monarch.GetHerHis] chambers, asphyxiated."
 dignity_preserves: "The interaction in the court almost proves to be too much for [Root.Monarch.GetName], but after several days of hiding in [Root.Monarch.GetHerHis] chambers, [Root.Monarch.GetSheHe] comes out and resumes normal duties."
 neutered: "Neutered"
 neutered_desc: "Our embarassment in the Reyllean court will stick with us for a long time, making forming any sort of independence movement significantly harder."
 fate_of_the_elernels: "The Elernel dynasty is no more, being relegated to the annals of history - and with them, goes the grand gathering; we revert to a traditional monarchy."
 flavor_carn.1.t: "The Ilivian question"
 flavor_carn.1.d: "Not too long ago, our former overlords - the Reylleans - conquered the Sironian town of Ilivian, sitting on the coast of the Gulf of Ilivian; it is a relatively small town, yet the Sironians and especially the Sironian government still see it as an open wound on the map, a wound that they would like to mend by any means necessary. While negotiations between Reyllea and the Sironians were never more than a suggestion we now, as the proprietors of the town, have been contacted by a Sironian diplomatic party in Lestria with the goal of starting discussions on the topic - and, they hope, fix the mistakes of the Reyllean kings. How do we respond?"
 flavor_carn.1.a: "We're better than the Reylleans - Let's give it back to the Sironians"
 flavor_carn.1.b: "What happened in Ilivian was tragic - We need to pay the debt the Reylleans accrued."
 flavor_carn.1.c: "We conquered it rightfully from the Reylleans, we must demand compensation for the town."
 flavor_carn.1.f: "How dare! It's our land, if they want it back they should come and take it from us!"
 flavor_carn.2.t: "Negotiations concluded"
 flavor_carn.2.d: "The sironians - wise in their negotiations - have accepted our generous offer for the city of Ilivian, and the city is now theirs once again. Though we may have missed out on a valuable port-city, surely good relations with the Sironians are a greater benefit to us than the benefits that Ilivian could have granted us in the long term."
 flavor_carn.2.a: "Then so it shall be!"
 flavor_carn.3.t: "The Black Library"
 flavor_carn.3.d: "[Root.Monarch.GetName] is sitting at [Root.Monarch.GetHerHis] throne in the Lestrian imperial palace. It's been a calm day - something that's growing more and more unusual these days. Suddenly, a man arrives at [Root.Monarch.GetHerHis] feet. He refers to himself as Daria, a local perhaps judging by the name, and he has a request. Ambition shines in his eyes as he speaks; he wants to build a great library in the province of Costaigne, a days walk to the north, a center of learning and perhaps theology. All he's requesting is a bit of money, and free reign on the land to hire builders and architects. There is potential in  him. But, at the same time, can an unknown man like this really be trusted with the project?"
 flavor_carn.3.a: "Deny his request. Who is this man, daring to come to the court asking for money?"
 flavor_carn.3.b: "Accept his request, and give him the money he wants to start construction."
 flavor_carn.3.c: "Surely you know more about building libraries than your citizens?"
 flavor_carn.4.t: "The grand gathering"
 flavor_carn.4.d: "Our previous ruler - may they find peace in what comes next - has passed. Rumours are still coming in, and noone is exactly sure how it happened; some say they passed in their sleep, peacefully. Others say it was an assassination, maybe even divine intervention, but no matter the case the nation needs a leader - turning to tradition, the regency council left in our previous rulers wake ends up organizing a grand gathering, where all the nobles of Carn and spectators from lands afar gather to vote on, and hopefully inaugurate, the new Caeron of Carn. The only question is, who is it going to be..."
 flavor_carn.4.a: "We want an Elernel!"
 flavor_carn.4.b: "Let's give someone else a shot for once."
 flavor_carn.5.d: "Our previous ruler - may they find peace in what comes next - has passed. Rumours are still coming in, and noone is exactly sure how it happened; some say they passed in their sleep, peacefully. Others say it was an assassination, maybe even divine intervention, but no matter the case the nation needs a leader - turning to tradition, the regency council left in our previous rulers wake ends up organizing a grand gathering, where all the nobles of Carn and spectators from lands afar gather to vote on, and hopefully inaugurate, the new Caeron of Carn. The only question is, who is it going to be...\n\nThe people, ever hungry for noble and powerful leaders, still remember Kerplis. According to many he was the greatest Caeron in a century - and no Caeron since has been able to live up to what he managed to accomplish in his reign. It's seeming more and more like this grand gathering will be of vital importance to the future of the nation, in more ways than one..."
 flavor_carn.6.t: "The Elernel family"
 flavor_carn.6.d: "[Root.Monarch.GetName] has been watching the progress on the black library for some time now. It’s progressing remarkably fast - a large, black tower has been erected on a hill in what was previously nothing but a tiny village, and soon people expect, it’ll grow into something much larger than even that. Right after the messenger carrying the status update on the black library leaves [Root.Monarch.GetName]'s court, someone unexpected enters the Lestrian palace. It’s Daria, and walking beside him is none other than the Caeron’s sole daughter.\n\nThey start speaking almost in unison, both clearly nervous about confronting [Root.Monarch.GetName] like this - as they talk, they explain that they met each other shortly after the building permit for the black library was first granted, and that they’ve been in love ever since. All he asks is the Caeron's blessing to take her hand in marriage; naturally, this would also make him [Root.Monarch.GetName]'s son-in-law, but..\n\nBefore the Caeron finishes [Root.Monarch.GetHerHis] thought, Daria interrupts with another - much bolder - request. He wants to be adopted into the family, to be made into an Elernel, if not in blood atleast in spirit. The sheer boldness of this man, to not only stroll into the palace asking to marry the Caeron’s daughter, but to also ask to be made an Elernel in the process - if nothing else, the tenacity of him must be admired…"
 flavor_carn.6.a: "Grant his request"
 flavor_carn.6.b: "How dare he..? Guards, take him away!"
 flavor_carn.7.t: "All the small things"
 flavor_carn.7.d: "It's been a busy few months - for everyone. No matter the outcome the war took a heavy toll on the land and especially the people; farms still lay deserted, their former owners long-since buried, whether that be on the battlefield or in a cemetery. [Root.Monarch.GetName] has spent the last few days travelling the countryside, taking in the situation and keeping up the morale of their citizens. In a rare lull [Root.Monarch.GetSheHe] veers off to the side of the dirt-paved road - and finds a beautiful, blooming patch of cornflowers. A sign of things to come, perhaps. "
 flavor_carn.7.a: "Send thanks to Aegmer with a quick prayer to the man in the porcelain mask."
 flavor_carn.7.b: "There's no time for this."
 flavor_carn.8.t: "Hostile takeover"
 flavor_carn.8.d: "It started as a normal day - then, suddenly, it was not. It all happened so quickly, surely this must have been planned months in advance; The ever-loyal Erneraevis are nowhere to be seen, something [Root.Monarch.GetName] hadn’t noticed until it was too late. Daria - that foul man the Caeron once thought to adopt as his own son - is now standing in the throne room, demanding the throne for himself, with a full regiment of your own soldiers backing him up. It doesn’t seem like there’s many options available…"
 flavor_carn.8.a: "Try to argue with him; after all, the Caeron’s will is Aegmer’s will"
 flavor_carn.8.b: "Concede. He’s won. Better to give up and spare your own life."
 flavor_carn.8.c: "Concede - on a condition. He needs to promise to preserve the grand gathering."
 flavor_carn.9.t: "Against all odds"
 flavor_carn.9.d: "The Caeron won - somehow, [Root.Monarch.GetSheHe] won. After a brief few minutes in argument, Daria concedes, and takes a step back, signalling for his soldiers to lay down their weapons aswell. “You’re right”, he says, “I made a mistake - misjudged you, my Caeron. Anyone can see that the will of Aegmer flows within you; i only wish that I had seen it myself sooner, so that things hadn’t had to come to this.” He promises to leave the court, and return to the black library - in any normal situation he'd have been exiled for something like this, but considering the ease at which he almost usurped power, maybe it’s best to not make unnecessary demands..."
 flavor_carn.9.a: "Let's hope for a calmer tomorrow."
 flavor_carn.10.t: "Royal values"
 flavor_carn.10.d: "“The grand gathering, you say?” His tone is mocking, almost sneering, as if looking down at a civilian feebly asking the soldier to spare his family. Which might not be all that far from the truth, in this situation. Eventually, he sighs, and says simply, “let me discuss it with my countrymen, and i’ll come back to you, peasant.”"
 flavor_carn.10.a: "It’s a pretty simple request…"
 flavor_carn.11.t: "All the small things"
 flavor_carn.11.d: "[Root.Monarch.GetName] has been having restless dreams for the past week, all consisting of the same repeated sequence of events. In the dreams, [Root.Monarch.GetSheHe]'s walking on a dirt path - it's pitch black, not even the stars in the sky above being visible, yet somehow [Root.Monarch.GetSheHe]'s still able to see in the general area around [Root.Monarch.GetHerselfHimself]. [Root.Monarch.GetSheHe] walks for what feels like an eternity, never veering off the path, until suddenly [Root.Monarch.GetSheHe]'s stopped by someone, or something, at the entrance to what looks like a large sheep pen. [Root.Monarch.GetSheHe] can't see the person, if it even is a person, that stopped [Root.Monarch.GetHerHim] but the command is clear"
 flavor_carn.11.a: "It's a bad omen - we need to be careful."
 flavor_carn.11.b: "They're just dreams, what's the worst that could happen?"
 flavor_carn.12.t: "The Carnian Liberation Army"
 flavor_carn.12.d: ""
 flavor_carn.12.a: "Fund them covertly, in order to bolster our shot at independence."
 flavor_carn.12.b: "Why continue working in the shadows?"
 flavor_carn.12.c: "We're better off without them."
 flavor_carn.13.t: "Wayshrines"
 flavor_carn.13.d: "[Root.Adm_Advisor.GetName] - the Carnian court inquisitor - has come to [Root.Monarch.GetName] with a suggestion that [Root.Adm_Advisor.GetSheHe] claims could, if implemented well, significantly expand the reach of Aegmerism in our home region - in short, [Root.Adm_Advisor.GetSheHe] wants to set up shrines to the saints that criss-cross our country, with the goal of potentially converting weary travellers to the Aegmerist faith. As Aegmerism is not fully entrenched in our lands yet, it could be something to consider, and maybe something to keep the churches satisfied."
 flavor_carn.13.a: "Let's see where it goes."
 flavor_carn.13.b: "Shrines? We can do better than that."
 flavor_carn.13.c: "It's a waste of time."
 flavor_carn.14.t: "Family bonds"
 flavor_carn.14.d: "The court in Evansyllo is buzzing with activity, like always - messengers, diplomats and royal courtiers flowing in and out of the palace like worker bees around their hive. Today, however, is a special day, for everyone involved. Not too long ago the Carnians were despised in these parts, seen as rebellious problem-makers seconds from declaring independence, or seeking alliances with the Audaladae up north. Now, however, [Root.Monarch.GetName] has ascended to being a second hand of the Reyllean king [A12.Monarch.GetName], and numerous Elernels are mingling with the other noble houses of Reyllea. Despite the added bureaucracy, many are enjoying the change in tone compared to our previous status - and soon, it may bring additional benefits. In an activity lull, [Root.Monarch.GetName] is summoned to the throne. Bowing down [Root.Monarch.GetSheShe] asks simply, "
 flavor_carn.14.a: "My liege, I graciously accept your offer."
 flavor_carn.14.b: "My liege, i'm afraid this won't be possible..."
 flavor_carn.15.t: "Swamp of royalty"
 flavor_carn.15.d: "In politics, there is only one rule - whoever can ruin you, will ruin you. The time since the wedding was first put into plan has been a hectic one, for both parties. In order to live up to the grand event that it will be for both houses, a similarly gargantuan amount of preparation for the week of festivities leading up to the ceremony itself has been conducted, with several hundred guests planning on arriving. In the Lestrian palace, however, the mood is currently anything but positive. In all of [Root.Monarch.GetName]'s excitement to potentially put an Elernel on the line to Reyllean succession, something had slipped under the table unnoticed. Due to an obscure clause in the Reyllean succession code, the marriage planned wouldn't unite the houses of Elernel and De Reyllea, but instead simply make the Elernels a branch of the De Reyllea - something with significantly less prestige, and more importantly, something that would disqualify any potential Lestrian heirs from claiming the throne. It's a bad situation, in all aspects. Did the Reyllean monarch know this? It's unclear, but it's entirely possible. What matters in the present is - how shall the situation be dealt with?"
 flavor_carn.15.a: "Confront the Reyllean monarch."
 flavor_carn.15.b: "They deceived us! Send a letter - we're calling off the wedding."
 flavor_carn.16.t: "Kneeling on spiked knees"
 flavor_carn.16.d: "The monarch felt imposing, too imposing, as [A12.Monarch.GetSheHim] looked down from the gilded throne. [Root.Monarch.GetName] had been keenly aware of [Root.Monarch.GetHerHis] status as a vassal, a lesser junior partner before, but in this moment - confronting someone in such a way made it abundantly clear who was the one that held the true power; made it abundantly clear who could, at any moment, call for the guards to take this faint little Elernel away to be executed in the city, or thrown into a dungeon never to be seen again. The power imbalance could be felt in the air, setting like heavy stones in a lake, yet there was no backing out. There was a single goal to be achieved, to be negotiated towards. Any show of weakness would just make the situation that much more difficult. As [Root.Monarch.GetName] opened [Root.Monarch.GetHerHis] mouth to speak, something suddenly figuratively hit the back of [Root.Monarch.GetHerHis] throat like an arrow, penetrating deep into [Root.Monarch.GetHerHis] mind and settling there, burrowing, ever deeper. A realization that..."
 flavor_carn.16.a: "How can you claim to have any leverage when you can't even manage your own citizenry?"
 flavor_carn.16.b: "A disease-riddled swamp-man has more prestige than you. Bow, Maybe you'll be shown mercy."
 flavor_carn.16.c: "Your dynasty is pure filth - Save what little honor you have left and scram, dog."
 flavor_carn.16.e: "Preserve your dignity, and leave. It's the most you can do. You can't win this."
 flavor_carn.16.f: "Tell me this - who is really in charge?"
 flavor_carn.17.t: "Fate of the Elernels"
 flavor_carn.17.d: "It's over. [Root.Monarch.GetName] wasn't good enough, plain and simple. Or maybe it was the country, the courtiers, who knows - what matters is, something buckled, and the whole dynasty came crashing down with it, like a skull under the pressure of a hammer now nothing's left except viscera in wake and misery. The guards were called, as they always would be. All the blame placed on a single person. But what does it matter? Soon the Elernels shall be no more - relegated to a footnote in the annals of history, like so many other dynasties. It didn't have to come to this, yet it did. And now, Carn is facing the consequences."
 flavor_carn.17.a: "History is cruel."
 flavor_carn.18.t: "The argument"
 flavor_carn.18.d: "The belltower in Evansyllo rings, once. Down on the street a town crier calls out; he speaks of a war high up in the north, though scarcely anyone concerns themselves to listen to him. On the square a musician plays his lute, hoping for donations from passers-by's, unaware that he's the target of a murder plot that will when dusk comes spring into action - such is life. In the court, the argument nears its first hour. Centered on the relative power of the Elernels to the De Reyllea family, it seems to be going in circles, until [Root.Monarch.GetName] suddenly pivots to their mutual past in sparwood...\n\nAt two, a baker starts a discussion with his assistants concerning the rising cost of ingredients for their bread. The harvest has been poor this year, they say, and prices might rise even further this winter. Someone suggests substituting part of the flour with sawdust; surely no one would notice, right? The baker, reluctantly, agrees to the cost saving measure. Meanwhile, a knight in shining armor passes through the town, and upon hearing the bard's music is reminded of a past point in his life - a point in his life where she had things to worry about other than what feudal lord will call her to fight in petty local feuds next. Meanwhile, [Root.Monarch.GetName] has just brought up the question of popular support, something the Reyllean monarch has no answer to - yet. A bit later, [A12.Monarch.GetName] manages to switch the argument around to the decentralized politics of Haven, and how, in the grander scheme of things, maybe dynasties don't mean all that much. \n\nAt hour three of the argument, [A12.Monarch.GetName] gives up, his throat hoarse and tired. "
 flavor_carn.18.a: "Take your spoils."
 flavor_carm.19.t: "The blue wedding"
 flavor_carn.19.d: "Blue shining skies and verdant fields stretch as far as the eye can see - it's a summer wedding, as was requested; cornflowers dot the lands. [Root.Monarch.GetName], not wanting to steal the show from the couple, is standing among the crowds. Hundreds of people, most of them nobles and royals, are here, for though the soon-to-bes hold no significant power, merely being minor nobles of Reyllea and Carn, what they represent is something special. A unification of families, of old dynasties that centuries ago, fleeing from Sparwood together, are now united in full. At the front, an Aegmerist priest goes on to bless the couple. From the distance that [Root.Monarch.GetName] is standing at, it's hard to hear the words exactly - but it's not like it matters. As they finalize their vows, it's hard to focus on the cheering when all that's on the mind of the Carnian royal is one thing - they won, and there's no going back."
 flavor_carn.19.a: "To glory!"
 flavor_carn.20.t: "Disgraced royals"
 flavor_carn.20.d: "It's been a great many years since [Root.Monarch.GetName] last conversed with their former overlords in the dynasty of De Reyllea - the once mighty Reylleans, at one point thought unstoppable, is now a mere shell of its former self after undergoing all manner of crises and internal disasters, no small part being that of the Carnian independence war. Though they have numerous times attempted to re-enforce their will upon the Caeronate, at no point have they attempted to converse with the great Caeron himself since independence - until now. A man enters the Lestrian palace, seeking an audience with the Caeron. Ragged and haggardly, the guards assumed he was a mere beggar, and as is custom forwarded the matter of how to deal with the poor to the Caeron; it's not until he bows before the throne and starts talking that [Root.Monarch.GetName] realizes that this is no person down on their luck, even if that surely is the case as well. He is, in fact, royal, or rather formerly royal. The son of the current Reyllean king, in fact, now disgraced after an incident he refuses to talk about, out of shame. What really matters though, is his requests; he wants to take the throne, overthrow his father and become king again. And, in return, he'll become a loyal subject of Carn. A decent proposal, perhaps, if we want to commit to it - though it might end up being a costly war."
 flavor_carn.20.a: "Accept his request."
 flavor_carn.20.b: "We're better off not getting involved. "
 miremen_customs.1.t: "Mhyrish Customs"
 miremen_customs.1.d: "It has long been a part of our people's heritage to perform the yearly cultural and religious ceremonies in the heart of the swamps of which our people call home. However, in recent years some have been questioning this custom, with the sharp onset of diseases that accompany such ceremonies shaking causing the populace to question their necessity."
 miremen_customs.1.a: "Tradition has always kept our people thriving. Host the ceremony"
 miremen_customs.1.b: "Cancel the ceremony"
 miremen_customs.1.c: "Relocate to a less sultry part of the swamps"
 miremen_customs.1.c.tt: "Available because Ruler is Insightful"
 carvay_flavor.1.t: "Port Ravenus Revolt!"
 carvay_flavor.1.d: "Port Ravenus always served as Carvay's bread basket since the founding of it allowing Carvay citizens to remove one of their biggest household expenses or significantly reduce the amount of money they must spend on remaining alive. this used to allow us to focus on luxury trading rather than farming. However that changed with the revolt of Essendor of Ravenus who disobeyed the Carvay government due to their lack of action during the Dandelion wars. since the dandelion wars are over shall we march down and claim what is rightfully ours?"
 carvay_flavor.1.a: "For the Doge!"
 carvay_flavor.1.a.tt: "this will put us at war with Ravenus!!!"
 carvay_flavor.1.b: "We must bide our time"
 carvay_flavor.1.b.tt: "We will never be able to claim all of Ravenus if we wait!"
 knossos_sparring.2.t: "A Sparring contest?"
 knossos_sparring.2.d: "The tensions between us and the Knossian kingdom have been high over the past few decades, and ramped up during the Dandelion wars. Should we offer them a friendly competition to ease tensions?"
 knossos_sparring.2.a: "Yes!"
 knossos_sparring.2.a.tt: "Keep in mind there is a high likelyhood this could go very badly, very quickly..."
 knossos_sparring.2.b: "Absolutely not!"
 knossos_sparring.2.b.tt: "..."
 knossos_sparring.3.t: "The King is Dead!"
 knossos_sparring.3.d: "King Alesander has declared war on the Despots in Donsktopt for their trechary against the Order!"
 knossos_sparring.3.a: "This means war!"
 knossos_sparring.3.a.tt: "King Inorico was killed by one of the Despots in Donsktopt!"
 knossos_sparring.4.t: "Knossian Sparring tournament!"
 knossos_sparring.4.d: "The knossosians have decided to participate in a tournament to east tensions!"
 knossos_sparring.4.a: "Lets see if it works"
 knossos_sparring.5.t: "Donsktopt offer to a tournament?"
 knossos_sparring.5.d: "Should we accept their offer to go to a tournament?"
 knossos_sparring.5.a: "Go get them!"
 knossos_sparring.5.a.tt: "There is a very high chance our king will fight in the tournament himself..."
 knossos_sparring.5.b: "Aboslutely not!"
 knossos_sparring.5.b.tt: "..."
 knossos_sparring.6.t: "They have declined."
 knossos_sparring.6.d: "For whatever reason the king of Knossos has refused our request for a tournament. so much for those preperations."
 knossos_sparring.6.a: "The bastards!"
 knossos_sparring.6.a.tt: "you have dodged a very dangerous arrow..."
 donsktopt_primer.1.t: "Military in Crisis"
 donsktopt_primer.1.d: "Since their great fracture over policy in the Trillium War, tensions between Donskopt and the Order Knossos have been at an all time high. For centuries, the Knossians stood side by side with Donsktopt in their defense of the Republic and upholding their mutual interests. However, come the onslaught of the Trillium War, relations became strained to say the least. The Knossian Order desired to ally with Bardonia, their Dandelist brethren, whereas the Republic was split between neutrality and supporting the rest of the League in their defense of Urnu-Arrak. Ultimately the dispute became so heated that the Knossians left court in Donskopt, and retreated into their holds along the Eastern reaches. Following the defeat of the Coalition in the Trillium War, Knossos became even further entrenched in their disdain for the vacillating bureaucrats in Donskopt who had kept them from a seat at the victory table. Each side has tried reaching out to the other to find agreement, but thus far, to no avail. Now, tensions are soaring and reconciliation seems a far off fantasy. Donskopt scambles to fix their reliance on mercenaries and rebuild a proper professional army, whilst Knossos consolidates greater power on the frontier. All the while, onlookers gaze on as it appears yet another Vastallosi Conflict looms on the horizon"
 donsktopt_primer.1.a: "This will not be good"
 donsktopt_primer.1.a.tt: "The military will need great reworking if we are to survive the coming storm..."
